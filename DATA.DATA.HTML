<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex Nathaniel</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}

body{
    height:100vh;
    overflow:hidden;
    background:radial-gradient(circle at center,#0a0f2c,#000814);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

/* Bintang */
canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}

.container{
    width:90%;
    max-width:400px;
    padding:30px 20px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    border-radius:20px;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
    text-align:center;
    animation:fadeIn 1.5s ease;
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}

.profile{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid white;
    margin-bottom:15px;
    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

h1{margin-bottom:5px;}
p{font-size:14px;opacity:0.8;margin-bottom:25px;}

.button{
    display:block;
    margin:12px 0;
    padding:14px;
    border-radius:12px;
    text-decoration:none;
    font-weight:bold;
    color:white;
    transition:0.3s;
}

.button:hover{
    transform:scale(1.07);
    box-shadow:0 0 15px rgba(255,255,255,0.5);
}

.youtube{background:#FF0000;}
.instagram{background:#C13584;}
.tiktok{background:#111;}
.twitter{background:#1DA1F2;}
.facebook{background:#1877F2;}

.music-btn{
    margin-top:15px;
    font-size:12px;
    cursor:pointer;
    opacity:0.7;
}
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="container">
    <img src="PP.png" class="profile">
    <h1>Alex Nathaniel</h1>
    <p>Calm Mind | Night Sky 🌌</p>

    <a class="button youtube" href="https://youtube.com/@USERNAME_KAMU" target="_blank">YouTube</a>
    <a class="button instagram" href="https://instagram.com/aerlunelukes" target="_blank">Instagram</a>
    <a class="button tiktok" href="https://tiktok.com/@ercopecc" target="_blank">TikTok</a>
    <a class="button twitter" href="https://x.com/USERNAME_KAMU" target="_blank">X</a>
    <a class="button facebook" href="https://facebook.com/USERNAME_KAMU" target="_blank">Facebook</a>

    <div class="music-btn" onclick="toggleMusic()">🔊 Toggle Music</div>
</div>

<audio id="bgMusic" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8e6b0d9f6c.mp3?filename=deep-space-ambient-110624.mp3" type="audio/mpeg">
</audio>

<script>
/* Bintang Animasi */
const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let stars=[];
for(let i=0;i<200;i++){
    stars.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        radius:Math.random()*1.5,
        speed:Math.random()*0.5
    });
}

function drawStars(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="white";
    stars.forEach(s=>{
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.radius,0,Math.PI*2);
        ctx.fill();
        s.y+=s.speed;
        if(s.y>canvas.height){
            s.y=0;
            s.x=Math.random()*canvas.width;
        }
    });
    requestAnimationFrame(drawStars);
}
drawStars();

/* Musik */
let music=document.getElementById("bgMusic");
function toggleMusic(){
    if(music.paused){
        music.play();
    }else{
        music.pause();
    }
}
</script>

</body>
</html>
